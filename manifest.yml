modules:
  # Jira work item: full report (panel opened from the work item's Apps menu)
  jira:issuePanel:
    - key: specguard-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Spec Guard
      icon: resource:icons;specguard.svg

  # Jira work item: compact status in the details sidebar, shown on every work item
  jira:issueContext:
    - key: specguard-context
      resource: context
      resolver:
        function: resolver
      render: native
      title: Spec Guard
      label: Spec alignment
      icon: resource:icons;specguard.svg

  # Jira global page: all checked work items, plus demo data
  jira:globalPage:
    - key: specguard-dashboard
      resource: dashboard
      resolver:
        function: resolver
      render: native
      title: Spec Guard
      icon: resource:icons;specguard.svg

  # Confluence spec page: linked work items and the requirement coverage map
  confluence:contentBylineItem:
    - key: specguard-byline
      resource: byline
      resolver:
        function: resolver
      render: native
      title: Spec Guard
      tooltip: Jira work items that implement this spec
      icon: resource:icons;specguard.svg

  # Makes the alignment summary searchable with JQL, e.g. specGuardConflicts > 0
  jira:entityProperty:
    - key: specguard-alignment-index
      entityType: issue
      propertyKey: specguard
      values:
        - path: score
          type: number
          searchAlias: specGuardScore
        - path: conflicts
          type: number
          searchAlias: specGuardConflicts
        - path: missing
          type: number
          searchAlias: specGuardMissing
        - path: specChanged
          type: number
          searchAlias: specGuardSpecChanged

  rovo:agent:
    - key: spec-guard-agent
      name: Spec Guard
      icon: resource:icons;specguard.svg
      description: "Checks Jira work items against their Confluence specifications and flags drift before code is written."
      prompt: resource:agent-prompt;prompt.txt
      conversationStarters:
        - Is this work item aligned with its spec?
        - What does the spec require for this work item?
        - Check my implementation against the spec
        - Which requirements of this spec are not covered?
      actions:
        - get-spec-context
        - check-alignment
        - verify-change
        - get-alignment-status
        - get-spec-coverage
        - align-work-item
        - apply-alignment
        - create-gap-work-items
        - get-job-result

  # The same actions as MCP tools for external agents (Claude Code, Cursor, ...)
  rovo:mcp:
    - key: spec-guard-mcp
      name: Spec Guard
      tools:
        - get-spec-context
        - check-alignment
        - verify-change
        - get-alignment-status
        - get-spec-coverage
        - align-work-item
        - apply-alignment
        - create-gap-work-items
        - get-job-result

  action:
    - key: get-spec-context
      name: Get spec context
      function: getSpecContextFn
      actionVerb: GET
      description: "Call BEFORE implementing a Jira work item. Returns the work item, the full text of its linked Confluence spec pages (the source of truth) and the latest alignment analysis."
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: "The Jira work item key, for example PROJ-123."
    - key: check-alignment
      name: Check spec alignment
      function: checkAlignmentFn
      actionVerb: GET
      description: "Checks a Jira work item against its linked Confluence spec: each in-scope requirement as covered, missing, conflict, unclear or delivered elsewhere, with verified verbatim quotes, a score and open questions."
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: "The Jira work item key, for example PROJ-123."
    - key: verify-change
      name: Verify change against spec
      function: verifyChangeFn
      actionVerb: GET
      description: "Call AFTER implementing a Jira work item. Checks a summary or diff of the change against the linked Confluence spec; returns pass, warn or fail with findings, spec quotes and suggestions."
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: "The Jira work item key, for example PROJ-123."
        change:
          title: Change summary or diff
          type: string
          required: true
          description: "What was implemented, as a concise summary or a unified diff."
    - key: get-alignment-status
      name: Get alignment status
      function: getAlignmentStatusFn
      actionVerb: GET
      description: "Fast, no AI: the last alignment analysis of a Jira work item and whether the spec or the work item changed since then."
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: "The Jira work item key, for example PROJ-123."
    - key: get-spec-coverage
      name: Get spec coverage
      function: getSpecCoverageFn
      actionVerb: GET
      description: "Maps every requirement of a Confluence spec to the Jira work items that deliver it and lists gaps (requirements no work item covers) and conflicts."
      inputs:
        spec:
          title: Spec page or work item
          type: string
          required: true
          description: "A Confluence page URL or page ID, or a Jira work item key whose linked spec should be mapped."
    - key: align-work-item
      name: Propose spec-aligned acceptance criteria
      function: alignWorkItemFn
      actionVerb: GET
      description: "Proposes acceptance criteria for a Jira work item that match its linked Confluence spec. Changes nothing; returns a proposalId to pass to apply-alignment after the user approves."
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: "The Jira work item key, for example PROJ-123."
    - key: apply-alignment
      name: Apply approved acceptance criteria
      function: applyAlignmentFn
      actionVerb: UPDATE
      description: "Applies a proposal from align-work-item to the work item's acceptance criteria and adds an audit comment. Only call this after the user approved the proposed changes."
      inputs:
        proposalId:
          title: Proposal id
          type: string
          required: true
          description: "The proposalId returned by align-work-item."
    - key: create-gap-work-items
      name: Create work items for spec gaps
      function: createGapItemsFn
      actionVerb: CREATE
      description: "Creates Jira work items for requirements of a Confluence spec that no work item covers (gaps in the coverage map), each linked to the spec. Never creates a second work item for the same gap."
      inputs:
        spec:
          title: Spec page or work item
          type: string
          required: true
          description: "A Confluence page URL or page ID, or a Jira work item key whose linked spec has gaps."
        requirementIds:
          title: Requirement IDs
          type: string
          required: false
          description: "Optional comma-separated requirement IDs (e.g. FR-5, SR-1). Empty means all gaps."
    - key: get-job-result
      name: Get job result
      function: getJobResultFn
      actionVerb: GET
      description: "Returns the result of a check-alignment, verify-change or align-work-item call that answered with pending: true."
      inputs:
        kind:
          title: Job kind
          type: string
          required: true
          description: "The job.kind value from the pending response: analyze-action, verify or align-action."
        key:
          title: Job key
          type: string
          required: true
          description: "The job.key value from the pending response (the work item key)."

  trigger:
    # Spec page edited: notify linked work items
    - key: spec-page-updated
      function: pageUpdatedFn
      events:
        - avi:confluence:updated:page
    # Work item created or edited: index spec links, re-check analysed work items
    - key: work-item-changed
      function: issueChangedFn
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true

  # Fallback in case a Confluence event is not delivered
  scheduledTrigger:
    - key: spec-hourly-check
      function: pollSpecsFn
      interval: hour

  # Atlassian-hosted Claude models (no data leaves Atlassian)
  llm:
    - key: specguard-llm
      model:
        - claude

  # Background queue for all LLM work
  consumer:
    - key: specguard-jobs-consumer
      queue: specguard-jobs
      function: jobWorkerFn

  function:
    - key: jobWorkerFn
      handler: index.jobWorker
      timeoutSeconds: 600
    - key: resolver
      handler: index.handler
    - key: getSpecContextFn
      handler: index.getSpecContextAction
    - key: checkAlignmentFn
      handler: index.checkAlignmentAction
    - key: verifyChangeFn
      handler: index.verifyChangeAction
    - key: getAlignmentStatusFn
      handler: index.getAlignmentStatusAction
    - key: getSpecCoverageFn
      handler: index.getSpecCoverageAction
    - key: alignWorkItemFn
      handler: index.alignWorkItemAction
    - key: applyAlignmentFn
      handler: index.applyAlignmentAction
    - key: createGapItemsFn
      handler: index.createGapItemsAction
    - key: getJobResultFn
      handler: index.getJobResultAction
    - key: pollSpecsFn
      handler: index.pollSpecs
    - key: pageUpdatedFn
      handler: index.pageUpdated
    - key: issueChangedFn
      handler: index.issueChanged

resources:
  - key: main
    path: src/frontend/index.jsx
  - key: context
    path: src/frontend/context.jsx
  - key: dashboard
    path: src/frontend/dashboard.jsx
  - key: byline
    path: src/frontend/byline.jsx
  - key: icons
    path: src/icons
  - key: agent-prompt
    path: src/prompts

permissions:
  # Map form: read scopes allow offline impersonation, so background jobs run with the
  # permissions of the user who started them.
  scopes:
    read:jira-work:
      allowImpersonation: true
    write:jira-work: {}
    read:page:confluence:
      allowImpersonation: true
    read:confluence-content.summary: {}
    write:page:confluence: {}
    read:space:confluence: {}
    storage:app: {}

app:
  runtime:
    name: nodejs24.x
    memoryMB: 512
    architecture: arm64
  id: ari:cloud:ecosystem::app/00236d0b-a8f0-4b50-82c2-f1d2d34642cc
  compatibility:
    jira:
      required: true
    confluence:
      required: false
